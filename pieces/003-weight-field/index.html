<meta property="og:title" content="Weight Field — Lumen 003">
<meta property="og:description" content="A word whose weight follows your pointer. Motion study by @aldininin.">

<style>
@font-face{font-family:"Inter Var";src:url(inter-var.woff2) format("woff2");font-weight:100 900;font-display:block}
:root{color-scheme:dark;--bg:#0E0E10;--fg:#E8E6E1;--dim:#6B6A70;--amber:#F2A65A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:"Inter Var",Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.links{position:fixed;top:20px;right:24px;z-index:5;display:flex;gap:16px;font-size:12px;line-height:1;
  font-variation-settings:'wght' 400}
.links a{color:var(--dim);transition:color 280ms cubic-bezier(0.22,1,0.36,1)}
.links a:hover{color:var(--fg)}
.stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
.word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;
  line-height:0.9;white-space:nowrap;font-variation-settings:'wght' 200,'opsz' 32}
.cell{position:relative;display:flex;justify-content:center;flex:none}
.cell span{display:block;opacity:0;font-variation-settings:'wght' 100,'opsz' 32}
.bar{position:absolute;left:0;top:0;height:2px;background:var(--amber);opacity:0;will-change:transform,opacity;transform-origin:0 0}
.label{position:fixed;left:24px;bottom:24px;font-size:13px;color:var(--dim);font-variation-settings:'wght' 400}
@media (min-width:761px){.label{left:48px;bottom:40px}}
#probe{position:absolute;visibility:hidden;white-space:pre;font-size:100px;left:-9999px;top:0}
</style>
</head>
<body>
<nav class="links" aria-label="Links">
  <a href="https://github.com/SolitaryMist/lumen" target="_blank" rel="noopener">GitHub</a>
  <a href="https://x.com/aldininin" target="_blank" rel="noopener">@aldininin</a>
</nav>
<main class="stage" id="stage" aria-label="Weight Field: the word LUMEN, letters turn bold near your pointer">
  <div class="word" id="word" aria-hidden="true"></div>
  <div class="bar" id="bar"></div>
</main>
<div class="label">003 — weight field</div>
<span id="probe" aria-hidden="true"></span>
<script>
/* ===== Weight Field parameters (identical in SwiftUI / Compose) =====
   WORD            "LUMEN"
   W_MIN_INTRO     100     intro start weight
   W_REST          200     baseline weight (d >= R)
   W_MAX           900     weight at letter centre (d <= 0)
   R_FACTOR        1.6     R = average letter width (at 900) * 1.6
   SPRING          stiffness 170, damping 22, mass 1  (SwiftUI response 0.48 / dampingFraction 0.84)
   INTRO           stagger 60ms, 600ms per letter, cubic-bezier(0.22,1,0.36,1), wght 100->200, opacity 0->1
   LEAVE           480ms back to 200, cubic-bezier(0.65,0,0.35,1); bar fades 300ms
   BAR             2px tall, 30% of letter width, centred under heaviest letter, #F2A65A
   TRACKING        -0.035em, line-height 0.9
   WIDTH           72vw desktop, 86vw mobile (<=760px)
   TOUR (no hover) sweep left->right 1400ms cubic-bezier(0.22,1,0.36,1), then cosine ping-pong period 7000ms
                   starting at the right end (velocity 0 at both ends, so the handoff is velocity-continuous)
   RESUME          800ms after pointer release; 1000ms smoothstep blend from pointer position into the ping-pong
   REDUCED MOTION  no tour, no springs: 200ms linear to target; intro = fade only
   COLORS          bg #0E0E10, word #E8E6E1, secondary #6B6A70, accent #F2A65A
   ==================================================================== */
const P = {
  word:'LUMEN', wIntro:100, wRest:200, wMax:900, rFactor:1.6,
  k:170, c:22, m:1,
  introStagger:60, introDur:600, leaveDur:480, barFade:300,
  tracking:-0.035, widthDesktop:0.72, widthMobile:0.86,
  sweepDur:1400, pingPeriod:7000, resumeDelay:800, resumeBlend:1000, reducedDur:200,
};
const bez=(x1,y1,x2,y2)=>t=>{ if(t<=0)return 0; if(t>=1)return 1;
  let u=t; for(let i=0;i<8;i++){const cx=3*x1*u*(1-u)**2+3*x2*u*u*(1-u)+u**3-t;
    const dx=3*x1*(1-u)**2+6*(x2-x1)*u*(1-u)+3*(1-x2)*u*u; if(Math.abs(dx)<1e-6)break; u-=cx/dx; u=Math.min(1,Math.max(0,u));}
  return 3*y1*u*(1-u)**2+3*y2*u*u*(1-u)+u**3; };
const easeOut=bez(0.22,1,0.36,1), easeInOut=bez(0.65,0,0.35,1);
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const noHover=matchMedia('(hover: none)').matches;

const wordEl=document.getElementById('word'), bar=document.getElementById('bar'), stage=document.getElementById('stage'), probe=document.getElementById('probe');
const L=[...P.word].map(ch=>{const cell=document.createElement('div');cell.className='cell';
  const s=document.createElement('span');s.textContent=ch;cell.appendChild(s);wordEl.appendChild(cell);
  return {ch,cell,s,w:P.wIntro,v:0,op:0,target:P.wRest,tw:null,w200:0,w900:0,cx:0,cellW:0};});

let fontSize=100, R=100, wordLeft=0, wordRight=0, midY=0;
function measure(){
  for(const l of L){ probe.textContent=l.ch;
    probe.style.fontVariationSettings="'wght' 900,'opsz' 32"; l.w900u=probe.getBoundingClientRect().width/100;
    probe.style.fontVariationSettings="'wght' 200,'opsz' 32"; l.w200u=probe.getBoundingClientRect().width/100; }
  const trackU=P.tracking; // em per gap
  const sumU=L.reduce((a,l)=>a+l.w900u,0)+trackU*(L.length-1);
  const frac=innerWidth<=760?P.widthMobile:P.widthDesktop;
  fontSize=frac*innerWidth/sumU;
  wordEl.style.fontSize=fontSize+'px';
  const total=sumU*fontSize; let x=(innerWidth-total)/2;
  L.forEach((l,i)=>{ l.cellW=l.w900u*fontSize; l.w200=l.w200u*fontSize; l.w900=l.cellW;
    l.cell.style.width=l.cellW+'px'; l.cell.style.marginLeft=i?(trackU*fontSize)+'px':'0';
    l.cx=x+l.cellW/2; x+=l.cellW+trackU*fontSize; });
  wordLeft=L[0].cx; wordRight=L[L.length-1].cx;
  R=L.reduce((a,l)=>a+l.cellW,0)/L.length*P.rFactor;
  midY=innerHeight/2;
  barY=midY+fontSize*0.44; // ~0.08em below cap baseline
}
let barY=0;

// pointer / virtual point state
let px=null, mode='idle', leaveT0=0, t0=0, lastRelease=0, dragging=false, tour=null;
let barX=0, barV=0, barW=0, barWV=0, barOp=0, barOpFrom=0, barOpTo=0, barOpT0=0, barInit=false;
function setBarOp(to,now){ if(barOpTo===to)return; barOpFrom=barOp; barOpTo=to; barOpT0=now; }

stage.addEventListener('pointermove',e=>{ if(noHover && !dragging)return; px=e.clientX; mode='live'; setBarOp(1,performance.now()); });
stage.addEventListener('pointerdown',e=>{ dragging=true; stage.setPointerCapture(e.pointerId); px=e.clientX; mode='live'; setBarOp(1,performance.now()); });
const release=e=>{ if(!dragging)return; dragging=false; lastRelease=performance.now();
  if(noHover){ mode='hold'; } else if(e.type!=='pointerup'){ startLeave(); } };
stage.addEventListener('pointerup',release); stage.addEventListener('pointercancel',release);
stage.addEventListener('pointerleave',()=>{ if(!noHover && !dragging) startLeave(); });
function startLeave(){ const now=performance.now(); mode='leave'; px=null; leaveT0=now;
  L.forEach(l=>{l.leaveFrom=l.w;}); setBarOp(0,now); }

// tour: x(t) in px; sweep then cosine ping-pong (phase 0 = right end, heading left)
const ping=(ph)=>{const mid=(wordLeft+wordRight)/2, half=(wordRight-wordLeft)/2; return mid+half*Math.cos(ph);};
function tourX(now){
  if(!tour) return null;
  const t=now-tour.t0;
  if(tour.kind==='sweep'){
    if(t<P.sweepDur) return wordLeft+(wordRight-wordLeft)*easeOut(t/P.sweepDur);
    tour={kind:'ping',t0:tour.t0+P.sweepDur,ph0:0};
    return tourX(now);
  }
  const ph=tour.ph0+2*Math.PI*t/P.pingPeriod, x=ping(ph);
  if(tour.from!=null && t<P.resumeBlend){ const k=smooth(0,1,t/P.resumeBlend); return tour.from+(x-tour.from)*k; }
  return x;
}
function resumeTour(now,fromX){
  const mid=(wordLeft+wordRight)/2, half=(wordRight-wordLeft)/2;
  const c=Math.max(-1,Math.min(1,(fromX-mid)/half));
  tour={kind:'ping',t0:now,ph0:Math.acos(c),from:fromX};
}

function targetFor(l,x){ const d=Math.abs(x-l.cx); return P.wMax-(P.wMax-P.wRest)*smooth(0,R,d); }

let last=0;
function frame(now){
  const dt=Math.min(0.05,(now-(last||now))/1000); last=now;
  const tIntro=now-t0;
  // virtual point
  let x=null;
  if(mode==='live'||mode==='hold'){ x=px;
    if(mode==='hold' && now-lastRelease>P.resumeDelay && !reduced){ resumeTour(now,px); mode='tour'; x=tourX(now); } }
  else if(mode==='tour'){ x=tourX(now); px=x; }
  const introDone=tIntro>P.introStagger*(L.length-1)+P.introDur;

  let heavy=null;
  L.forEach((l,i)=>{
    const lt=tIntro-i*P.introStagger;
    if(lt<P.introDur){ const e=easeOut(Math.max(0,lt)/P.introDur);
      l.op=e; l.w=reduced?P.wRest:P.wIntro+(P.wRest-P.wIntro)*e; l.v=0; }
    else { l.op=1;
      if(mode==='leave'){ const k=Math.min(1,(now-leaveT0)/P.leaveDur); l.w=l.leaveFrom+(P.wRest-l.leaveFrom)*easeInOut(k); l.v=0; }
      else { const tgt=x==null?P.wRest:targetFor(l,x);
        if(reduced){ if(!l.tw||Math.abs(l.tw.to-tgt)>4){ l.tw={from:l.w,to:tgt,t0:now}; }
          const k=Math.min(1,(now-l.tw.t0)/P.reducedDur); l.w=l.tw.from+(l.tw.to-l.tw.from)*k; }
        else { const n=4,h=dt/n; for(let s=0;s<n;s++){ const a=(-P.k*(l.w-tgt)-P.c*l.v)/P.m; l.v+=a*h; l.w+=l.v*h; } }
      }
    }
    l.w=Math.max(P.wIntro,Math.min(P.wMax,l.w));
    l.s.style.opacity=l.op.toFixed(3);
    l.s.style.fontVariationSettings=`'wght' ${l.w.toFixed(1)},'opsz' 32`;
    if(!heavy||l.w>heavy.w) heavy=l;
  });

  // bar: spring to heaviest letter (same spring)
  const curW=heavy.w200+(heavy.w900-heavy.w200)*((heavy.w-P.wRest)/(P.wMax-P.wRest));
  const tw=0.3*Math.max(heavy.w200,curW), tx=heavy.cx-tw/2;
  if(!barInit){ barX=tx; barW=tw; barInit=true; }
  if(reduced){ barX=tx; barW=tw; }
  else { const n=4,h=dt/n; for(let s=0;s<n;s++){
    barV+=((-P.k*(barX-tx)-P.c*barV)/P.m)*h; barX+=barV*h;
    barWV+=((-P.k*(barW-tw)-P.c*barWV)/P.m)*h; barW+=barWV*h; } }
  const fk=Math.min(1,(now-barOpT0)/P.barFade); barOp=barOpFrom+(barOpTo-barOpFrom)*fk;
  bar.style.opacity=(introDone?barOp:0).toFixed(3);
  bar.style.transform=`translate(${barX}px,${barY}px) scaleX(${barW})`;
  bar.style.width='1px';

  // start tour after intro on touch devices
  if(noHover && !reduced && mode==='idle' && introDone){ tour={kind:'sweep',t0:now}; mode='tour'; setBarOp(1,now); }
  if(!document.hidden) requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ last=0; requestAnimationFrame(frame);} });
addEventListener('resize',measure);
document.fonts.load("100px 'Inter Var'").then(()=>document.fonts.ready).then(()=>{ measure(); t0=performance.now(); requestAnimationFrame(frame); });
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
