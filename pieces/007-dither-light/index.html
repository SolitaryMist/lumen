<script>
/* ===== Dither light parameters (identical in SwiftUI / Compose / React / Vue) =====
   SPHERE     Centred. Diameter min(600px, 62vh, 84vw). The device-pixel radius
              is that length times dpr, rounded to a whole pixel, so the
              silhouette sits on the pixel grid. No shadow, ground, or extra marks.
   COLOURS    bg #0B0B0C · dots #E8E6E1 · highlight #FFB547 where spec > 0.55 ·
              secondary #8A8A8A · weak #3A3A3A. Two inks only; tone is dot density.
   DITHER     8×8 Bayer. Cell side = 2·round(2·dpr) device px, dpr capped at 2
              (4 device px at dpr 1, 8 at dpr 2, about 4 CSS px). Press cell is
              2·round(dpr), also even. Cell index = floor(frag / cell), so the grid
              starts on an even device pixel. One sample at the cell centre. The cell
              is a filled square, or empty. Never a circle, never a fractional cell.
   LIGHT      L = normalize(lx, ly, 0.9). y is positive downward, so up is negative.
              lum = 0.06 + 0.94·max(0, N·L) · smoothstep(-0.05, 0.25, N·L)
              The smoothstep softens the terminator. Blinn specular, exponent 40.
              Brightness 0→1 multiplies lum before the threshold, so dots grow in.
   REST       (0.35, -0.45), normalized to the sphere radius.
   SPRING     Stiffness 170, damping 22, mass 1. a = (-k (x-target) - c v) / m.
              1/240 s semi-implicit steps. Hover target is (pointer − centre) / radius,
              length clamped to 1.2.
   SWIFTUI    .spring(response: 0.48, dampingFraction: 0.84)
   COMPOSE    spring(dampingRatio: 0.84, stiffness: 170)
              The frame loop is the shared integrator above.
   PRESS      Hold: cell 4px → 2px over 240ms, cubic-bezier(0.2, 0.8, 0.2, 1).
              Release: back over 320ms, cubic-bezier(0.4, 0, 0.2, 1).
              The two integer cells cross-fade. Reduced motion switches at once.
   GUIDE      No fine pointer: lx 0→+0.6 over 1400ms, cubic-bezier(0.45, 0, 0.55, 1),
              ly fixed at -0.35. Drift lx = 0.6·cos(ωt), period 8000ms.
              driftT0 = guide start + 1400. Past that, lx = 0.6·cos of the
              same elapsed time, so the join is +0.6 with velocity 0.
   DRAG       Without a fine pointer the light follows through the same 170/22 spring.
              On release, wait 2000ms, then 600ms ease-in-out to the nearer of ±0.6
              (ly back to -0.35), then cosine drift from that end (phase 0 or π).
   FINE       matchMedia (hover: hover) and (pointer: fine). A real pointermove of
              type mouse or pen promotes the page into pointer-follow. Rest, then wait.
   READOUT    Azimuth θ = round(atan2(lx, 0.9) in degrees). Elevation φ =
              round(atan2(-ly, hypot(lx, 0.9))). Fixed-width digits, tabular nums.
   ENTRANCE   Hidden until the shader has compiled and a frame is drawn.
              The shown clock then starts, shared with the guide: canvas and
              readout opacity 0→1 linear 160ms, brightness 0→1 over 600ms,
              cubic-bezier(0.2, 0.8, 0.2, 1). Title waits 120ms, then 300ms fade
              and a 4px rise, same curve. Opacity is set from that clock.
   REDUCED    No drift, no brightness growth. Light stays at rest. Only the 160ms
              opacity fade. Press switches cell size immediately.
   DRAW       On demand. Stop when the spring has settled and nothing else is moving.
   ================================================================= */
const P = {
  rest: [0.35, -0.45], guideLx: 0.6, guideLy: -0.35,
  k: 170, c: 22, m: 1, clampLen: 1.2,
  swiftResponse: 0.48, swiftDamping: 0.84,
  composeDamping: 0.84, composeStiffness: 170,
  pressIn: 240, pressOut: 320, brightMs: 600, stageFade: 160,
  titleDelay: 120, titleMs: 300, titleRise: 4,
  guide: 1400, driftPeriod: 8000, hold: 2000, ret: 600,
  easePress: [0.2, 0.8, 0.2, 1],
  easeRelease: [0.4, 0, 0.2, 1],
  easeBright: [0.2, 0.8, 0.2, 1],
  easeGuide: [0.45, 0, 0.55, 1],
  easeInOut: [0.42, 0, 0.58, 1],
  specCut: 0.55, specPow: 40, lz: 0.9
};
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec2 uCenter;
uniform vec2 uRadius;
uniform vec2 uLight;
uniform vec2 uCell;
uniform float uMix;
uniform float uBright;
out vec4 o;
const float BAYER[64] = float[64](
  0.0,32.0,8.0,40.0,2.0,34.0,10.0,42.0,
  48.0,16.0,56.0,24.0,50.0,18.0,58.0,26.0,
  12.0,44.0,4.0,36.0,14.0,46.0,6.0,38.0,
  60.0,28.0,52.0,20.0,62.0,30.0,54.0,22.0,
  3.0,35.0,11.0,43.0,1.0,33.0,9.0,41.0,
  51.0,19.0,59.0,27.0,49.0,17.0,57.0,25.0,
  15.0,47.0,7.0,39.0,13.0,45.0,5.0,37.0,
  63.0,31.0,55.0,23.0,61.0,29.0,53.0,21.0
);
float thresh(vec2 idx){
  int ix = int(mod(idx.x, 8.0));
  int iy = int(mod(idx.y, 8.0));
  if (ix < 0) ix = 0; if (ix > 7) ix = 7;
  if (iy < 0) iy = 0; if (iy > 7) iy = 7;
  return (BAYER[iy * 8 + ix] + 0.5) / 64.0;
}
vec3 ink(float cell){
  vec3 bg = vec3(11.0/255.0, 11.0/255.0, 12.0/255.0);
  float side = max(2.0, floor(cell + 0.5));
  vec2 idx = floor(gl_FragCoord.xy / side);
  vec2 mid = (idx + 0.5) * side;
  vec2 down = vec2(mid.x, uRes.y - mid.y);
  vec2 p = (down - uCenter) / max(uRadius, vec2(1.0));
  if (dot(p, p) > 1.0) return bg;
  vec3 N = vec3(p, sqrt(max(0.0, 1.0 - dot(p, p))));
  vec3 L = normalize(vec3(uLight, 0.9));
  float ndl = dot(N, L);
  float lum = (0.06 + 0.94 * max(ndl, 0.0) * smoothstep(-0.05, 0.25, ndl)) * uBright;
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(N, H), 0.0), 40.0);
  if (lum <= thresh(idx)) return bg;
  if (spec > 0.55) return vec3(1.0, 181.0/255.0, 71.0/255.0);
  return vec3(232.0/255.0, 230.0/255.0, 225.0/255.0);
}
void main(){
  o = vec4(mix(ink(uCell.x), ink(uCell.y), clamp(uMix, 0.0, 1.0)), 1.0);
}`;
const VS = `#version 300 es
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t;
  const Y = t => ((ay * t + by) * t + cy) * t;
  const dX = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const e = X(t) - x, d = dX(t);
      if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break;
      t -= e / d;
    }
    if (t < 0 || t > 1) {
      let a = 0, b = 1; t = x;
      for (let i = 0; i < 30; i++) { const v = X(t); if (v < x) a = t; else b = t; t = (a + b) / 2; }
    }
    return Y(Math.min(1, Math.max(0, t)));
  };
}
const easePress = bez(...P.easePress);
const easeRelease = bez(...P.easeRelease);
const easeBright = bez(...P.easeBright);
const easeGuide = bez(...P.easeGuide);
const easeInOut = bez(...P.easeInOut);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function spring(pos, vel, target, dt, k, c, m) {
  if (!(dt > 0)) return [pos, vel];
  const n = Math.max(1, Math.round(dt * 240)), h = dt / n;
  for (let s = 0; s < n; s++) {
    vel += ((-k * (pos - target) - c * vel) / m) * h;
    pos += vel * h;
  }
  return [pos, vel];
}
function cellsFor(raw) {
  const dpr = Math.min(raw > 0 ? raw : 1, 2);
  let rest = 2 * Math.round(2 * dpr);
  let press = 2 * Math.round(dpr);
  if (rest < 2) rest = 2;
  if (press < 2) press = 2;
  if ((press & 1) === 1) press -= 1;
  if ((rest & 1) === 1) rest += 1;
  if (press >= rest) press = Math.max(2, rest - 2);
  return { dpr, rest, press };
}
function angles(lx, ly) {
  const lz = P.lz;
  const theta = Math.atan2(lx, lz) * 180 / Math.PI;
  const phi = Math.atan2(-ly, Math.hypot(lx, lz)) * 180 / Math.PI;
  return [Math.round(theta), Math.round(phi)];
}

const stage = document.getElementById('stage');
const canvas = document.getElementById('view');
const head = document.querySelector('.head');
const readout = document.getElementById('readout');
const tn = document.getElementById('tn');
const ts = document.getElementById('ts');
const pn = document.getElementById('pn');
const ps = document.getElementById('ps');
window.__boot = { hidden: getComputedStyle(stage).visibility };
const reduceMq = matchMedia('(prefers-reduced-motion: reduce)');
const fineMq = matchMedia('(hover: hover) and (pointer: fine)');
let reduced = reduceMq.matches;
let fine = !reduced && fineMq.matches;
let phase = 'rest';
let lx = P.rest[0], ly = P.rest[1], vx = 0, vy = 0;
let targetX = lx, targetY = ly;
let pressU = 0, pressFrom = 0, pressTo = 0, pressT0 = 0, pressDur = P.pressIn, pressing = false;
let bright = reduced ? 1 : 0;
let t0 = 0, guideT0 = 0, driftT0 = 0, holdT0 = 0, returnT0 = 0, last = 0;
let returnFromX = 0, returnFromY = 0, returnToX = P.guideLx, returnToY = P.guideLy;
let raf = 0, wake = 0, ready = false, started = false, pointerId = null;
let viewW = 1, viewH = 1, viewDpr = 1;
let shownTh = 21, shownPh = 25;
const trace = [];
let gl = null, prog = null, locs = null, glError = '';

function reset(now) {
  t0 = now;
  last = 0;
  vx = 0; vy = 0;
  clearTimeout(wake); wake = 0;
  if (reduced) {
    phase = 'rest';
    fine = false;
    lx = P.rest[0]; ly = P.rest[1];
    targetX = lx; targetY = ly;
    bright = 1;
    pressU = pressing ? 1 : 0;
    pressFrom = pressU; pressTo = pressU;
    return;
  }
  bright = 0;
  fine = fineMq.matches;
  if (fine) {
    phase = 'rest';
    lx = P.rest[0]; ly = P.rest[1];
    targetX = lx; targetY = ly;
  } else {
    phase = 'guide';
    guideT0 = now;
    driftT0 = 0;
    lx = 0; ly = P.guideLy;
    targetX = lx; targetY = ly;
    vx = 0; vy = 0;
  }
}
function trackable(e) { return e.pointerType === 'mouse' || e.pointerType === 'pen'; }
function mapPointer(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const radius = Math.max(1, Math.min(600, rect.height * 0.62, rect.width * 0.84) / 2);
  let x = (clientX - (rect.left + rect.width / 2)) / radius;
  let y = (clientY - (rect.top + rect.height / 2)) / radius;
  const len = Math.hypot(x, y);
  if (len > P.clampLen) { const s = P.clampLen / len; x *= s; y *= s; }
  return [x, y];
}
function springTo(dt) {
  [lx, vx] = spring(lx, vx, targetX, dt, P.k, P.c, P.m);
  [ly, vy] = spring(ly, vy, targetY, dt, P.k, P.c, P.m);
  if (Math.abs(lx - targetX) < 1e-4 && Math.abs(ly - targetY) < 1e-4 && Math.abs(vx) < 1e-4 && Math.abs(vy) < 1e-4) {
    lx = targetX; ly = targetY; vx = 0; vy = 0;
    return true;
  }
  return false;
}
function cruiseX(el) {
  if (!(el > 0)) return 0;
  if (el >= P.guide) {
    const w = ((el - P.guide) / P.driftPeriod) * Math.PI * 2;
    return P.guideLx * Math.cos(w);
  }
  return easeGuide(el / P.guide) * P.guideLx;
}
function applyGuide(el, dt) {
  const prev = lx;
  lx = cruiseX(el);
  ly = P.guideLy;
  vx = dt > 0 ? (lx - prev) / dt : 0;
  vy = 0;
}
function applyDrift(now, dt) {
  const prev = lx;
  const w = ((now - driftT0) / P.driftPeriod) * Math.PI * 2;
  lx = P.guideLx * Math.cos(w);
  ly = P.guideLy;
  vx = dt > 0 ? (lx - prev) / dt : 0;
  vy = 0;
}
function beginReturn(now) {
  phase = 'return';
  returnT0 = now;
  returnFromX = lx;
  returnFromY = ly;
  returnToX = lx >= 0 ? P.guideLx : -P.guideLx;
  returnToY = P.guideLy;
}
function step(now) {
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  if (reduced) {
    bright = 1;
    lx = P.rest[0]; ly = P.rest[1]; vx = 0; vy = 0;
    targetX = lx; targetY = ly;
    phase = 'rest';
    pressU = pressing ? 1 : 0;
    pressFrom = pressU; pressTo = pressU;
    return now - t0 < P.stageFade;
  }
  bright = easeBright(clamp((now - t0) / P.brightMs, 0, 1));
  if (pressFrom !== pressTo) {
    const u = clamp((now - pressT0) / pressDur, 0, 1);
    const e = pressTo > pressFrom ? easePress(u) : easeRelease(u);
    pressU = pressFrom + (pressTo - pressFrom) * e;
    if (u >= 1) { pressU = pressTo; pressFrom = pressTo; }
  }
  let cont = (now - t0) < P.brightMs || Math.abs(pressU - pressTo) > 0.0008;
  if (phase === 'guide') {
    const el = now - guideT0;
    if (el >= P.guide) {
      driftT0 = guideT0 + P.guide;
      phase = 'drift';
    }
    applyGuide(el, dt);
    cont = true;
  } else if (phase === 'drift') {
    applyDrift(now, dt);
    cont = true;
  } else if (phase === 'return') {
    const u = clamp((now - returnT0) / P.ret, 0, 1);
    const e = easeInOut(u);
    const prev = lx;
    lx = returnFromX + (returnToX - returnFromX) * e;
    ly = returnFromY + (returnToY - returnFromY) * e;
    vx = dt > 0 ? (lx - prev) / dt : 0;
    vy = 0;
    if (u >= 1) {
      lx = returnToX; ly = returnToY; vx = 0; vy = 0;
      phase = 'drift';
      driftT0 = returnToX > 0 ? now : now - P.driftPeriod / 2;
    }
    cont = true;
  } else if (phase === 'hold') {
    const settled = springTo(dt);
    if (now - holdT0 >= P.hold) { beginReturn(now); cont = true; }
    else if (!settled) cont = true;
    else {
      const remain = P.hold - (now - holdT0);
      clearTimeout(wake);
      wake = setTimeout(() => { wake = 0; kick(); }, Math.max(0, remain));
    }
  } else if (!springTo(dt)) cont = true;
  const shown = reduced ? P.stageFade : Math.max(P.stageFade, P.brightMs, P.titleDelay + P.titleMs);
  if (now - t0 < shown) cont = true;
  return cont;
}
function follow(x, y) {
  targetX = x; targetY = y;
  phase = 'follow';
  clearTimeout(wake); wake = 0;
  kick();
}
function onMove(e) {
  if (reduced) return;
  const point = trackable(e);
  if (!point) {
    if (!(pressing && pointerId === e.pointerId && !fine)) return;
    const [x, y] = mapPointer(e.clientX, e.clientY);
    follow(x, y);
    return;
  }
  if (!fine) fine = true;
  const [x, y] = mapPointer(e.clientX, e.clientY);
  follow(x, y);
}
function onDown(e) {
  if (e.target.closest && e.target.closest('a')) return;
  if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
  pointerId = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  pressing = true;
  if (reduced) {
    pressU = 1; pressFrom = 1; pressTo = 1;
    draw(); paintReadout();
    return;
  }
  pressFrom = pressU; pressTo = 1; pressT0 = performance.now(); pressDur = P.pressIn;
  if (trackable(e)) fine = true;
  const [x, y] = mapPointer(e.clientX, e.clientY);
  follow(x, y);
  e.preventDefault();
}
function onUp(e) {
  if (pointerId !== null && e.pointerId !== pointerId) return;
  const was = pressing;
  pressing = false;
  pointerId = null;
  if (reduced) {
    pressU = 0; pressFrom = 0; pressTo = 0;
    draw(); paintReadout();
    return;
  }
  if (was) {
    pressFrom = pressU; pressTo = 0; pressT0 = performance.now(); pressDur = P.pressOut;
  }
  if (!fine && was && phase === 'follow') {
    phase = 'hold';
    holdT0 = performance.now();
  }
  kick();
}
function paintReadout() {
  const pair = angles(lx, ly);
  if (pair[0] !== shownTh) {
    shownTh = pair[0];
    tn.textContent = String(Math.abs(shownTh));
    ts.textContent = shownTh < 0 ? '-' : '';
  }
  if (pair[1] !== shownPh) {
    shownPh = pair[1];
    pn.textContent = String(Math.abs(shownPh));
    ps.textContent = shownPh < 0 ? '-' : '';
  }
}
function publish() {
  const cells = cellsFor(viewDpr);
  stage.dataset.phase = phase;
  stage.dataset.lx = lx.toFixed(5);
  stage.dataset.ly = ly.toFixed(5);
  stage.dataset.press = pressU.toFixed(4);
  stage.dataset.bright = bright.toFixed(4);
  stage.dataset.cellA = String(cells.rest);
  stage.dataset.cellB = String(cells.press);
  stage.dataset.fine = fine ? '1' : '0';
  stage.dataset.reduced = reduced ? '1' : '0';
  stage.dataset.ready = ready ? '1' : '0';
  const frames = (Number(stage.dataset.frames) || 0) + 1;
  stage.dataset.frames = String(frames);
  trace.push({ t: last || t0, lx, ly, phase, press: pressU, bright, fine: fine ? 1 : 0 });
  if (trace.length > 900) trace.splice(0, trace.length - 900);
}
function resize() {
  const cssW = Math.max(1, window.innerWidth);
  const cssH = Math.max(1, window.innerHeight);

  canvas.style.height = viewH + 'px';

    radius: gl.getUniformLocation(prog, 'uRadius'),
    light: gl.getUniformLocation(prog, 'uLight'),
    cell: gl.getUniformLocation(prog, 'uCell'),

  // frame. Fade, brightness, title, and guide share that presented clock.
  reset(performance.now());
  step(performance.now());
  draw();
  requestAnimationFrame(() => {
    reset(performance.now());
    step(performance.now());
    draw();
    // Stamp the shown clock after the draw, so a slow first frame
    // cannot consume the fade before anything is visible.
    const shown = performance.now();
    reset(shown);
    step(shown);

window.addEventListener('pointermove', onMove, { passive: true });
canvas.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointerup', onUp, { passive: true });
window.addEventListener('pointercancel', onUp, { passive: true });
window.addEventListener('resize', () => { resize(); if (ready) kick(); });

  if (!document.hidden && ready) { last = 0; kick(); }
});

    targetX = P.rest[0]; targetY = P.rest[1];

    holdT0, returnT0, targetX, targetY, pressing,

const fontReady = document.fonts && document.fonts.load

      document.fonts.load("400 13px 'Inter Var'")

  : Promise.resolve();
