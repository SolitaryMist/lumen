<!doctype html>
<html lang="en">
<head>

<title>Stack — Lumen 004</title>

<style>
@font-face{font-family:"Inter Var";src:url(inter-var.woff2) format("woff2");font-weight:100 900;font-display:block}
:root{color-scheme:dark;--bg:#0E0E10;--face:#18181C;--fg:#E8E6E1;--dim:#6B6A70;--amber:#F2A65A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:"Inter Var",Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.links{position:fixed;top:20px;right:24px;z-index:50;display:flex;gap:16px;font-size:12px;line-height:1;font-weight:400}
.links a{color:var(--dim);transition:color 280ms cubic-bezier(0.22,1,0.36,1)}
.links a:hover{color:var(--fg)}
.stage{position:fixed;inset:0;visibility:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stack{position:absolute;left:50%;top:50%;width:min(78vw,320px);aspect-ratio:8/11;
  transform:translate(-50%,calc(-50% - 15px))}
.card{position:absolute;inset:0;border-radius:18px;background:var(--face);border:1px solid rgba(255,255,255,0.06);
  padding:28px;display:flex;flex-direction:column;opacity:0;will-change:transform,opacity;
  transform-origin:50% 120%;touch-action:none;overflow:hidden}
@media (min-width:761px){.stack{width:320px;height:440px}.card{border-radius:20px}}
.card .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;border-radius:inherit}
.tick{width:24px;height:2px;background:var(--amber);opacity:0;margin-bottom:14px}
.no{font-size:96px;font-weight:600;letter-spacing:-0.04em;line-height:0.9}
.meta{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.t{font-size:15px;font-weight:500;line-height:1.3}
.s{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.35}
.open{font-size:13px;color:var(--dim);white-space:nowrap;transition:color 280ms cubic-bezier(0.22,1,0.36,1)}
.open:hover,.open:focus-visible{color:var(--fg)}
.count{position:fixed;left:24px;bottom:24px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;z-index:50}
.count b{font-weight:400;color:var(--amber)}
@media (min-width:761px){.count{left:48px;bottom:40px}}
</style>
</head>
<body>
<nav class="links" aria-label="Links">
  <a href="https://github.com/SolitaryMist/lumen" target="_blank" rel="noopener">GitHub</a>
  <a href="https://x.com/aldininin" target="_blank" rel="noopener">@aldininin</a>
</nav>
<main class="stage" id="stage" aria-label="Stack: drag or use the arrow keys to fling the top card">
  <div class="stack" id="stack"></div>
</main>
<div class="count" id="count" aria-live="polite"><b>01</b> / 05</div>
<script>
/* ===== Stack parameters (identical in SwiftUI / Compose) =====
   CARDS          5 · 320x440 desktop (r20) · min(78vw,320) at 8:11 mobile (r18) · padding 28
   STACK DEPTH i  translateY i*10px · scale 1-i*0.04 · face darkened 6% per level · depth 4 opacity 0
                  (opacity = clamp(4 - depth, 0, 1), so a card fades in as it rises from 4 to 3)
   INTRO          deal bottom -> top, stagger 70ms, 700ms each: position y+40 -> rest with cubic-bezier(0.22,1,0.36,1);
                  opacity 0 -> 1 linear in the first 160ms only. Stage hidden until fonts + layout are ready
   TICK           amber line only on the top card; fades in 200ms linear when a card becomes top
   DRAG           x 1:1, y * 0.6, rotation = clamp(x * 0.06 deg/px, +-14 deg), origin 50% 120%
                  card below rises by p*0.6 depth, p = min(|x| / 0.5W, 1)
   FLING IF       |x| > 0.35W  or  |vx| > 800 px/s   (velocity: samples from the last 80ms)
   FLING          360ms cubic-bezier(0.2,0.7,0.3,1) to x = +-(viewport/2 + W), rotate to +-24 deg, then depth 4 (opacity 0)
   SNAP BACK      spring k380 c30 m1 (SwiftUI response 0.32 / dampingFraction 0.77), starts with release velocity
   STACK SHIFT    spring k260 c26 m1 (0.39 / 0.81), stagger 40ms per card
   TILT (hover)   rotateX/Y max 6 deg, perspective 1000px, spring k200 c24 m1 (0.44 / 0.85)
   TAP            press counts as a click only if moved < 8px; only "Open" navigates
   HINT (touch)   2500ms idle after intro -> nudge left 28px and back, 900ms cubic-bezier(0.65,0,0.35,1),
                  max 2 times, 4000ms apart, cancelled for good on first touch
   REDUCED MOTION no tilt, no hint; fling = 200ms fade out; stack shift / snap back 200ms linear
   SPRINGS        semi-implicit Euler, fixed 1/240 s substeps
   ============================================================= */
const P = {
  dy:10, ds:0.04, shade:0.06,
  introStagger:70, introDur:700, introFade:160, introY:40, tickFade:200,
  yDamp:0.6, rotPerPx:0.06, rotMax:14, lift:0.6,
  flingX:0.35, flingV:800, velWindow:80,
  flingDur:360, flingRot:24,
  snap:{k:380,c:30}, shift:{k:260,c:26}, shiftStagger:40,
  tilt:{k:200,c:24}, tiltMax:6, perspective:1000,
  tapSlop:8,
  hintIdle:2500, hintX:28, hintDur:900, hintMax:2, hintGap:4000,
  reducedDur:200
};
const EASE_INTRO=[0.22,1,0.36,1], EASE_FLING=[0.2,0.7,0.3,1], EASE_HINT=[0.65,0,0.35,1];
function bez(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t, Y=t=>((ay*t+by)*t+cy)*t, dX=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{ if(x<=0)return 0; if(x>=1)return 1; let t=x;
    for(let i=0;i<8;i++){const e=X(t)-x,d=dX(t); if(Math.abs(e)<1e-6)break; if(Math.abs(d)<1e-6)break; t-=e/d;}
    if(t<0||t>1){let a=0,b=1;t=x;for(let i=0;i<30;i++){const v=X(t);if(v<x)a=t;else b=t;t=(a+b)/2;}}
    return Y(t); };
}
const eIntro=bez(...EASE_INTRO), eFling=bez(...EASE_FLING), eHint=bez(...EASE_HINT);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const canHover=matchMedia('(hover: hover) and (pointer: fine)').matches;

const DATA=[
  {slug:'001-rim-trace', title:'Rim Trace', sub:'A rim of light that follows you'},
  {slug:'002-dusk-mesh', title:'Dusk', sub:'A gradient that breathes'},
  {slug:'003-weight-field', title:'Weight Field', sub:'Type that gets heavier near you'},
  {slug:'004-throw-stack', title:'Stack', sub:'Fling a card, the deck follows'},
  {slug:null, title:'Coming soon', sub:'Next piece in the works'}
];
const stackEl=document.getElementById('stack'), countEl=document.getElementById('count');
const cards=DATA.map((d,i)=>{
  const el=document.createElement('article'); el.className='card';
  el.setAttribute('aria-label',`${String(i+1).padStart(2,'0')} ${d.title}`);
  el.innerHTML=`<div class="shade"></div><div class="tick"></div><div class="no">${String(i+1).padStart(2,'0')}</div>
  <div class="meta"><div><div class="t"></div><div class="s"></div></div>${d.slug?`<a class="open" href="/${d.slug}/">Open ↗</a>`:''}</div>`;
  el.querySelector('.t').textContent=d.title; el.querySelector('.s').textContent=d.sub;
  stackEl.appendChild(el);
  return {i,el,shadeEl:el.querySelector('.shade'),tickEl:el.querySelector('.tick'),
    depth:i,dv:0,dTarget:i,dStart:0,dSpring:P.shift,lin:null,
    x:0,vx:0,y:0,vy:0,mode:'rest',fl:null,op:1,tickT0:0,
    tx:0,tvx:0,ty:0,tvy:0,ttx:0,tty:0, intro:0,introT0:0};
});
// titles/subtitles from each piece's meta.json (fallbacks above)
DATA.forEach((d,i)=>{ if(!d.slug)return; fetch(`/${d.slug}/meta.json`).then(r=>r.ok?r.json():null).then(m=>{
  if(!m)return; if(m.title)cards[i].el.querySelector('.t').textContent=m.title; if(m.subtitle)cards[i].el.querySelector('.s').textContent=m.subtitle; }).catch(()=>{}); });

let order=cards.map(c=>c.i); // order[0] = top
let W=320, VW=innerWidth;
function measure(){ W=stackEl.offsetWidth; VW=innerWidth; }
measure(); addEventListener('resize',measure);

function updateCount(){ const n=String(order[0]+1).padStart(2,'0'); countEl.innerHTML=`<b>${n}</b> / 05`; }
updateCount();

function setDepthTargets(now){
  order.forEach((ci,d)=>{ const c=cards[ci]; if(c.mode==='fling')return;
    if(c.dTarget!==d){ c.dTarget=d; c.dStart=now+(d<4?d*P.shiftStagger:0);
      if(reduced) c.lin={from:c.depth,to:d,t0:now,dur:P.reducedDur}; } });
}

// ---------- spring step (semi-implicit Euler, 1/240 s) ----------
function spring(pos,vel,target,s,dt){ const a=-s.k*(pos-target)-s.c*vel; vel+=a*dt; pos+=vel*dt; return [pos,vel]; }

// ---------- input ----------
let drag=null, touched=false, hint=null, hintsDone=0, nextHint=Infinity, introEnd=0;
const samples=[];
function velocity(){ const now=performance.now(); while(samples.length>2&&now-samples[0].t>P.velWindow)samples.shift();
  if(samples.length<2)return [0,0]; const a=samples[0],b=samples[samples.length-1],dt=(b.t-a.t)/1000;
  return dt>0?[(b.x-a.x)/dt,(b.y-a.y)/dt]:[0,0]; }
function stopHint(){ touched=true; nextHint=Infinity; if(hint){ const c=cards[order[0]]; c.mode='spring'; c.vx=0; hint=null; } }

stackEl.addEventListener('pointerdown',e=>{
  stopHint();
  const top=cards[order[0]];
  if(!e.target.closest('.card')||e.target.closest('.card')!==top.el)return;
  if(top.mode==='fling')return;
  e.preventDefault();
  top.el.setPointerCapture(e.pointerId);
  drag={id:e.pointerId,c:top,sx:e.clientX,sy:e.clientY,x0:top.x,y0:top.y/P.yDamp,moved:0,target:e.target};
  top.mode='drag'; top.vx=top.vy=0; top.ttx=top.tty=0;
  samples.length=0; samples.push({t:performance.now(),x:e.clientX,y:e.clientY});
});
addEventListener('pointermove',e=>{
  if(drag&&e.pointerId===drag.id){
    const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy; drag.moved=Math.max(drag.moved,Math.hypot(dx,dy));
    drag.c.x=drag.x0+dx; drag.c.y=(drag.y0+dy)*P.yDamp;
    samples.push({t:performance.now(),x:e.clientX,y:e.clientY});
    return;
  }
  if(canHover&&!reduced&&e.pointerType==='mouse'){
    const c=cards[order[0]], r=stackEl.getBoundingClientRect();
    const nx=(e.clientX-(r.left+r.width/2))/(r.width/2), ny=(e.clientY-(r.top+r.height/2))/(r.height/2);
    const inside=Math.abs(nx)<=1&&Math.abs(ny)<=1;
    c.ttx=inside?clamp(-ny,-1,1)*P.tiltMax:0; c.tty=inside?clamp(nx,-1,1)*P.tiltMax:0;
  }
});
function release(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag; drag=null; const c=d.c;
  samples.push({t:performance.now(),x:e.clientX,y:e.clientY});
  const [vx,vy]=velocity();
  if(d.moved<P.tapSlop){ c.mode='spring'; c.vx=c.vy=0;
    const a=d.target.closest&&d.target.closest('.open'); if(a&&e.type==='pointerup'){ location.href=a.href; } return; }
  if(Math.abs(c.x)>P.flingX*W||Math.abs(vx)>P.flingV){
    const dir=Math.abs(vx)>P.flingV?Math.sign(vx):Math.sign(c.x)||1; fling(c,dir,vx);
  } else { c.mode='spring'; c.vx=vx; c.vy=vy*P.yDamp; if(reduced)c.lin2={x:c.x,y:c.y,t0:performance.now()}; }
}
addEventListener('pointerup',release); addEventListener('pointercancel',release);
stackEl.addEventListener('click',e=>{ if(e.target.closest('.open')&&e.detail!==0)e.preventDefault(); });
addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return; e.preventDefault(); stopHint();
  const c=cards[order[0]]; if(c.mode==='fling'||c.mode==='drag')return; fling(c,e.key==='ArrowLeft'?-1:1,0);
});
function fling(c,dir,vx){
  const now=performance.now();
  c.mode='fling'; c.fl={t0:now,x0:c.x,y0:c.y,r0:rotOf(c.x),x1:dir*(VW/2+W),r1:dir*P.flingRot};
  c.ttx=c.tty=0;
  order.push(order.shift()); cards[order[0]].tickT0=now; updateCount(); setDepthTargets(now);
}
function rotOf(x){ return clamp(x*P.rotPerPx,-P.rotMax,P.rotMax); }

// ---------- frame ----------
let last=0, t0=0;
function frame(now){
  const dt=last?Math.min(0.05,(now-last)/1000):0; last=now;
  const steps=Math.max(1,Math.round(dt*240)), h=dt/steps;
  const top=cards[order[0]];
  // live lift of the card below while dragging
  const pLift=drag?Math.min(Math.abs(top.x)/(0.5*W),1):0;
  // hint
  if(!reduced&&!canHover&&!touched&&hintsDone<P.hintMax&&now>=nextHint&&!hint&&top.mode==='rest'){
    hint={t0:now,c:top}; top.mode='hint'; }
  for(const c of cards){
    // intro
    const ti=clamp((now-c.introT0)/P.introDur,0,1); const ei=reduced?ti:eIntro(ti); const io=clamp((now-c.introT0)/P.introFade,0,1);
    // depth
    if(c.mode!=='fling'){
      if(c.lin){ const u=clamp((now-c.lin.t0)/c.lin.dur,0,1); c.depth=c.lin.from+(c.lin.to-c.lin.from)*u; if(u>=1)c.lin=null; }
      else if(now>=c.dStart){ for(let s=0;s<steps;s++)[c.depth,c.dv]=spring(c.depth,c.dv,c.dTarget,P.shift,h); }
      if(drag&&order[1]===c.i){ c.depth=1-pLift*P.lift; c.dv=0; }
    }
    // position
    let rot=0, op=1;
    if(c.mode==='fling'){
      const u=clamp((now-c.fl.t0)/(reduced?P.reducedDur:P.flingDur),0,1);
      if(reduced){ op=1-u; c.x=c.fl.x0; c.y=c.fl.y0; rot=c.fl.r0; }
      else { const e=eFling(u); c.x=c.fl.x0+(c.fl.x1-c.fl.x0)*e; c.y=c.fl.y0*(1-e); rot=c.fl.r0+(c.fl.r1-c.fl.r0)*e; }
      if(u>=1){ c.mode='rest'; c.x=c.y=c.vx=c.vy=0; c.depth=4; c.dv=0; c.dTarget=4; c.fl=null; rot=0; op=1; }
    } else if(c.mode==='spring'){
      if(c.lin2){ const u=clamp((now-c.lin2.t0)/P.reducedDur,0,1); c.x=c.lin2.x*(1-u); c.y=c.lin2.y*(1-u); if(u>=1){c.lin2=null;c.mode='rest';} }
      else { for(let s=0;s<steps;s++){ [c.x,c.vx]=spring(c.x,c.vx,0,P.snap,h); [c.y,c.vy]=spring(c.y,c.vy,0,P.snap,h); }
        if(Math.abs(c.x)<0.05&&Math.abs(c.vx)<1&&Math.abs(c.y)<0.05&&Math.abs(c.vy)<1){c.x=c.y=c.vx=c.vy=0;c.mode='rest';} }
      rot=rotOf(c.x);
    } else if(c.mode==='hint'){
      const u=clamp((now-hint.t0)/P.hintDur,0,1);
      c.x=-P.hintX*(u<0.5?eHint(u*2):1-eHint(u*2-1)); rot=rotOf(c.x);
      if(u>=1){ c.x=0; c.mode='rest'; hint=null; hintsDone++; nextHint=hintsDone<P.hintMax?now+P.hintGap:Infinity; }
    } else rot=rotOf(c.x);
    // tilt (top card only)
    if(c===top&&c.mode!=='fling'&&c.mode!=='drag'){} else { c.ttx=0; c.tty=0; }
    for(let s=0;s<steps;s++){ [c.tx,c.tvx]=spring(c.tx,c.tvx,c.ttx,P.tilt,h); [c.ty,c.tvy]=spring(c.ty,c.tvy,c.tty,P.tilt,h); }
    const d=c.mode==='fling'?0:c.depth;
    const depthOp=clamp(4-d,0,1);
    const yy=d*P.dy+c.y+(1-ei)*P.introY;
    const sc=1-d*P.ds;
    c.el.style.transform=`perspective(${P.perspective}px) translate3d(${c.x.toFixed(2)}px,${yy.toFixed(2)}px,0) rotate(${rot.toFixed(3)}deg) rotateX(${c.tx.toFixed(3)}deg) rotateY(${c.ty.toFixed(3)}deg) scale(${sc.toFixed(4)})`;
    c.el.style.opacity=(op*depthOp*io).toFixed(3);
    c.el.style.zIndex=c.mode==='fling'?'20':String(Math.round(100-d*10));
    c.shadeEl.style.opacity=(clamp(d,0,4)*P.shade).toFixed(3);
    c.tickEl.style.opacity=(c===top&&c.mode!=='fling'?clamp((now-c.tickT0)/P.tickFade,0,1):0).toFixed(3);
  }
  requestAnimationFrame(frame);
}
document.fonts.load("600 96px 'Inter Var'").then(()=>document.fonts.ready).then(start,start);
let started=false;
function start(){ if(started)return; started=true; measure();
  const now=performance.now();
  // deal bottom -> top: depth 4 first
  cards.forEach(c=>{ c.introT0=now+(4-c.i)*P.introStagger; }); cards[order[0]].tickT0=cards[order[0]].introT0;
  frame(now); last=0; document.getElementById('stage').style.visibility='visible';
  introEnd=now+4*P.introStagger+P.introDur; nextHint=introEnd+P.hintIdle;
}
window.__stack={P,cards,order:()=>order};
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
