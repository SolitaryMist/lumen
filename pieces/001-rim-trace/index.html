<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rim Trace — Lumen 001</title>
<meta property="og:title" content="Rim Trace — Lumen 001">
<meta property="og:description" content="Amber rim light touring a dark card. Motion study by @aldininin.">
<meta property="og:image" content="https://lumen-motion.vercel.app/001-rim-trace/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://lumen-motion.vercel.app/001-rim-trace/og.png">

<meta name="description" content="Rim Trace — amber rim light that tours a card edge, magnetizes to the pointer. Lumen 001 by @aldininin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0B0C; --card:#121214; --stroke:#2A2A2E;
  --fg:#EDEDED; --dim:#6B6B6B; --amber:#FFB547;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-soft:cubic-bezier(0.65,0,0.35,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);
  font:600 15px/1.4 Geist,ui-sans-serif,system-ui,sans-serif;
  letter-spacing:-.04em;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
.links{position:fixed;top:20px;right:24px;z-index:5;display:flex;gap:16px;
  font:400 12px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:0}
.links a{color:var(--dim);transition:color 280ms var(--ease-out)}
.links a:hover{color:var(--fg)}
.stage{min-height:100svh;display:grid;place-items:center;padding:24px}
.card{
  --lift:0px; --seg:0.12; --peak:0.95;
  position:relative;width:min(360px,88vw);aspect-ratio:1/1.25;
  border-radius:20px;background:var(--card);
  box-shadow:inset 0 0 0 1.5px var(--stroke);
  transform:translateY(var(--lift));
  cursor:pointer;touch-action:manipulation;
  opacity:0;translate:0 12px;
}
.card.ready{transition:none}
.card.enter{animation:cardIn 500ms var(--ease-out) 80ms both}
@keyframes cardIn{to{opacity:1;translate:0 0}}
.rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.rim .glow-path{fill:none;stroke:var(--amber);stroke-width:14;stroke-linecap:round;
  filter:url(#rimBlur);opacity:.55}
.rim .core-path{fill:none;stroke:var(--amber);stroke-width:1.5;stroke-linecap:butt}
.title{position:absolute;left:24px;right:24px;top:42%;transform:translateY(-50%);
  text-align:center;font-size:clamp(26px,7.5vw,32px);font-weight:600;letter-spacing:-.04em;
  color:var(--fg);z-index:1;pointer-events:none}
.meta{position:absolute;left:24px;right:24px;bottom:24px;text-align:center;z-index:1;pointer-events:none;
  font:400 12px/1.4 "JetBrains Mono",ui-monospace,monospace;letter-spacing:0;color:var(--dim)}
@media (max-width:760px){.title{font-size:28px}}
@media (prefers-reduced-motion:reduce){
  .card{opacity:1;translate:none;animation:none!important}
}
</style>
</head>
<body>
<nav class="links" aria-label="Links">
  <a href="https://github.com/SolitaryMist/lumen" target="_blank" rel="noopener">GitHub</a>
  <a href="https://x.com/aldininin" target="_blank" rel="noopener">@aldininin</a>
</nav>
<div class="stage">
  <div class="card" id="card" role="button" tabindex="0" aria-label="Rim Trace card">
    <svg class="rim" id="rim" aria-hidden="true">
      <defs>
        <filter id="rimBlur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
        <!-- soft falloff along the segment via stacked dashes -->
        <linearGradient id="segGrad" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FFB547" stop-opacity="0"/>
          <stop offset="35%" stop-color="#FFB547" stop-opacity="0.95"/>
          <stop offset="65%" stop-color="#FFB547" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#FFB547" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path class="glow-path" id="glowPath"></path>
      <path class="core-path" id="fadePathA"></path>
      <path class="core-path" id="fadePathB"></path>
      <path class="core-path" id="corePath"></path>
    </svg>
    <h1 class="title">Rim Trace</h1>
    <p class="meta">No. 001 · Lumen</p>
  </div>
</div>
<script>
(() => {
  // —— constants (design spec) ——
  const TOUR_MS = 8000;
  const INTRO_HALF_MS = 4000;
  const MAGNET_MS = 280;
  const BACK_MS = 420;
  const PRESS_MS = 300;
  const RELEASE_MS = 280;
  const SEG = 0.12;
  const SEG_PRESS = 0.28;
  const MAGNET_PAD = 48;
  const RADIUS = 20;
  const STROKE = 1.5;
  const INSET = STROKE / 2;
  const SPRING_M = { k: 180, d: 22, m: 1 };
  const SPRING_P = { k: 120, d: 20, m: 1 };
  const AMBER = '#FFB547';
  const PEAK = 0.95;
  const PEAK_PRESS = 1.0;

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const card = document.getElementById('card');
  const glowPath = document.getElementById('glowPath');
  const fadePathA = document.getElementById('fadePathA');
  const fadePathB = document.getElementById('fadePathB');
  const corePath = document.getElementById('corePath');
  const paths = [glowPath, fadePathA, fadePathB, corePath];

  // cubic-bezier solver
  const bez = (x1, y1, x2, y2) => {
    const A = (aA1, aA2) => 1 - 3 * aA2 + 3 * aA1;
    const B = (aA1, aA2) => 3 * aA2 - 6 * aA1;
    const C = (aA1) => 3 * aA1;
    const calc = (t, a1, a2) => ((A(a1, a2) * t + B(a1, a2)) * t + C(a1)) * t;
    const slope = (t, a1, a2) => 3 * A(a1, a2) * t * t + 2 * B(a1, a2) * t + C(a1);
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) {
        const s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break;
        t -= (calc(t, x1, x2) - x) / s;
        if (t < 0 || t > 1) break;
      }
      // bisection fallback
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 20; i++) {
        const cx = calc(t, x1, x2);
        if (Math.abs(cx - x) < 1e-6) break;
        if (cx < x) lo = t; else hi = t;
        t = (lo + hi) / 2;
      }
      return calc(t, y1, y2);
    };
  };
  const easeSoft = bez(0.65, 0, 0.35, 1);
  const easeOut = bez(0.16, 1, 0.3, 1);

  let perimeter = 0;
  let samples = []; // {x,y,t} along path, t in [0,1)

  function roundedRectPath(w, h, r, inset) {
    const x = inset, y = inset;
    const ww = w - inset * 2, hh = h - inset * 2;
    const rr = Math.max(0, Math.min(r - inset, ww / 2, hh / 2));
    // start at top midpoint, clockwise
    const midX = x + ww / 2;
    return [
      `M ${midX} ${y}`,
      `L ${x + ww - rr} ${y}`,
      `A ${rr} ${rr} 0 0 1 ${x + ww} ${y + rr}`,
      `L ${x + ww} ${y + hh - rr}`,
      `A ${rr} ${rr} 0 0 1 ${x + ww - rr} ${y + hh}`,
      `L ${x + rr} ${y + hh}`,
      `A ${rr} ${rr} 0 0 1 ${x} ${y + hh - rr}`,
      `L ${x} ${y + rr}`,
      `A ${rr} ${rr} 0 0 1 ${x + rr} ${y}`,
      `L ${midX} ${y}`,
    ].join(' ');
  }

  function layout() {
    const r = card.getBoundingClientRect();
    const w = r.width, h = r.height;
    const d = roundedRectPath(w, h, RADIUS, INSET);
    const svg = document.getElementById('rim');
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    paths.forEach(p => p.setAttribute('d', d));
    // measure via a temp path using getTotalLength
    perimeter = corePath.getTotalLength();
    samples = [];
    const N = 256;
    for (let i = 0; i < N; i++) {
      const t = i / N;
      const pt = corePath.getPointAtLength(t * perimeter);
      samples.push({ x: pt.x, y: pt.y, t });
    }
    applyDash(progress, segLen);
  }

  let progress = 0; // 0..1, position of segment CENTER along perimeter
  let segLen = SEG; // fraction of perimeter
  let peak = PEAK;
  let mode = 'intro'; // intro | tour | magnet | back
  let magnetTarget = 0;
  let pressUntil = 0;
  let pressed = false;

  // animated progress for magnet/back (spring or timed ease)
  let animFrom = 0, animTo = 0, animT0 = 0, animDur = 0, animEase = easeOut, animActive = false;
  // spring state for magnet progress
  let springOn = false, sp = 0, sv = 0, starget = 0, springCfg = SPRING_M;

  function shortestDelta(from, to) {
    let d = ((to - from) % 1 + 1) % 1;
    if (d > 0.5) d -= 1;
    return d;
  }

  function startEaseTo(to, dur, easeFn) {
    animFrom = progress;
    animTo = progress + shortestDelta(progress, to);
    animT0 = performance.now();
    animDur = dur;
    animEase = easeFn || easeOut;
    animActive = true;
    springOn = false;
  }

  function startSpringTo(to, cfg) {
    springOn = true;
    animActive = false;
    sp = progress;
    // unwrap target near current
    starget = progress + shortestDelta(progress, to);
    sv = 0;
    springCfg = cfg;
  }

  function applyDash(center, frac) {
    if (!perimeter) return;
    const len = Math.max(1, frac * perimeter);
    const half = len / 2;
    // dashoffset: SVG draws dash starting at offset; we want center at center*perimeter
    // With dasharray = len, gap = perimeter-len, the dash starts at -dashoffset (mod).
    // Center of dash at start + len/2. Set start = center*P - len/2 ⇒ offset = -(center*P - len/2)
    const start = ((center * perimeter - half) % perimeter + perimeter) % perimeter;
    const offset = -start;

    // glow: slightly longer soft blob
    const gLen = Math.min(perimeter * 0.22, len * 1.6);
    const gStart = ((center * perimeter - gLen / 2) % perimeter + perimeter) % perimeter;
    glowPath.style.strokeDasharray = `${gLen} ${Math.max(0, perimeter - gLen)}`;
    glowPath.style.strokeDashoffset = String(-gStart);
    glowPath.style.opacity = String(0.22 + (peak - PEAK) * 0.5);

    // fade wings (softer ends)
    const aLen = len * 1.55;
    const aStart = ((center * perimeter - aLen / 2) % perimeter + perimeter) % perimeter;
    fadePathA.style.strokeDasharray = `${aLen} ${Math.max(0, perimeter - aLen)}`;
    fadePathA.style.strokeDashoffset = String(-aStart);
    fadePathA.style.stroke = AMBER;
    fadePathA.style.opacity = String(peak * 0.22);

    const bLen = len * 1.28;
    const bStart = ((center * perimeter - bLen / 2) % perimeter + perimeter) % perimeter;
    fadePathB.style.strokeDasharray = `${bLen} ${Math.max(0, perimeter - bLen)}`;
    fadePathB.style.strokeDashoffset = String(-bStart);
    fadePathB.style.stroke = AMBER;
    fadePathB.style.opacity = String(peak * 0.45);

    corePath.style.strokeDasharray = `${len} ${Math.max(0, perimeter - len)}`;
    corePath.style.strokeDashoffset = String(offset);
    corePath.style.stroke = AMBER;
    corePath.style.opacity = String(peak);
  }

  function nearestT(localX, localY) {
    let best = 0, bestD = Infinity;
    for (const s of samples) {
      const dx = s.x - localX, dy = s.y - localY;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = s.t; }
    }
    return best;
  }

  function inMagnetZone(clientX, clientY) {
    const r = card.getBoundingClientRect();
    return clientX >= r.left - MAGNET_PAD && clientX <= r.right + MAGNET_PAD
        && clientY >= r.top - MAGNET_PAD && clientY <= r.bottom + MAGNET_PAD;
  }

  function toLocal(clientX, clientY) {
    const r = card.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  }

  // tour progress: eased ping along 0..1 over TOUR_MS, looping
  // Spec: ease cubic-bezier(0.65,0,0.35,1) per lap — map time→eased progress once per cycle
  let tourEpoch = 0; // ms timestamp when current seamless tour began
  let introDone = false;

  function tourProgressAt(now) {
    if (reduce) return 0; // top midpoint
    if (!introDone) {
      const t = Math.min(1, Math.max(0, (now - tourEpoch) / INTRO_HALF_MS));
      const e = easeSoft(t);
      // half lap from top midpoint (0) clockwise to 0.5
      if (t >= 1) {
        introDone = true;
        tourEpoch = now; // next loop continues from 0.5
        mode = 'tour';
        return 0.5;
      }
      return e * 0.5;
    }
    // full laps starting from 0.5 (seamless after intro)
    const u = ((now - tourEpoch) / TOUR_MS) % 1;
    return (0.5 + u) % 1;
  }

  // pointer
  let pointerX = 0, pointerY = 0, pointerIn = false;

  if (!reduce && !coarse) {
    addEventListener('pointermove', (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      pointerX = e.clientX; pointerY = e.clientY;
      const was = pointerIn;
      pointerIn = inMagnetZone(pointerX, pointerY);
      if (pointerIn) {
        const loc = toLocal(pointerX, pointerY);
        magnetTarget = nearestT(loc.x, loc.y);
        if (mode !== 'magnet') {
          mode = 'magnet';
          startSpringTo(magnetTarget, SPRING_M);
        } else {
          starget = progress + shortestDelta(progress, magnetTarget);
        }
      } else if (was && !pointerIn && mode === 'magnet') {
        mode = 'back';
        // ease back onto where auto tour would be now
        const target = tourProgressAt(performance.now());
        startEaseTo(target, BACK_MS, easeOut);
      }
    }, { passive: true });
  }

  function setPress(on) {
    pressed = on;
    if (on) {
      pressUntil = performance.now() + PRESS_MS;
      segLen = SEG_PRESS;
      peak = PEAK_PRESS;
      // lift via CSS var; spring-ish by timed ease
      animateLift(-4, PRESS_MS);
    } else {
      animateLift(0, RELEASE_MS);
      // segment returns after press window
    }
  }

  let liftFrom = 0, liftTo = 0, liftT0 = 0, liftDur = 0, liftAnim = false;
  function animateLift(toPx, dur) {
    const cur = parseFloat(getComputedStyle(card).getPropertyValue('--lift')) || 0;
    liftFrom = cur; liftTo = toPx; liftT0 = performance.now(); liftDur = dur; liftAnim = true;
  }

  if (!reduce) {
    card.addEventListener('pointerdown', (e) => {
      if (e.button != null && e.button !== 0) return;
      card.setPointerCapture?.(e.pointerId);
      setPress(true);
    });
    card.addEventListener('pointerup', () => setPress(false));
    card.addEventListener('pointercancel', () => setPress(false));
    card.addEventListener('pointerleave', () => { if (pressed) setPress(false); });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setPress(true); }
    });
    card.addEventListener('keyup', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setPress(false); }
    });
  } else {
    // reduced: press only opacity pulse
    card.addEventListener('pointerdown', () => { peak = PEAK_PRESS; applyDash(progress, SEG); });
    card.addEventListener('pointerup', () => { peak = PEAK; applyDash(progress, SEG); });
    card.addEventListener('pointercancel', () => { peak = PEAK; applyDash(progress, SEG); });
  }

  // bootstrap
  tourEpoch = performance.now();
  if (reduce) {
    mode = 'static';
    progress = 0;
    card.style.opacity = '1';
    card.style.translate = 'none';
  } else {
    card.classList.add('enter');
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.032, (now - last) / 1000);
    last = now;

    // press segment timeout
    if (!pressed && now >= pressUntil && (segLen !== SEG || peak !== PEAK)) {
      // ease segment/peak back
      segLen += (SEG - segLen) * Math.min(1, dt * 8);
      peak += (PEAK - peak) * Math.min(1, dt * 8);
      if (Math.abs(segLen - SEG) < 0.001) segLen = SEG;
      if (Math.abs(peak - PEAK) < 0.001) peak = PEAK;
    }

    if (liftAnim) {
      const k = Math.min(1, (now - liftT0) / liftDur);
      const e = easeOut(k);
      const v = liftFrom + (liftTo - liftFrom) * e;
      card.style.setProperty('--lift', v.toFixed(2) + 'px');
      if (k >= 1) liftAnim = false;
    }

    if (reduce) {
      progress = 0;
      applyDash(progress, SEG);
      requestAnimationFrame(frame);
      return;
    }

    if (mode === 'magnet' && springOn) {
      // update target each frame while pointer in
      if (pointerIn) {
        const loc = toLocal(pointerX, pointerY);
        magnetTarget = nearestT(loc.x, loc.y);
        starget = sp + shortestDelta(sp, magnetTarget);
      }
      const { k, d, m } = springCfg;
      const a = (k * (starget - sp) - d * sv) / m;
      sv += a * dt;
      sp += sv * dt;
      progress = ((sp % 1) + 1) % 1;
    } else if (animActive) {
      const k = Math.min(1, (now - animT0) / animDur);
      const e = animEase(k);
      const raw = animFrom + (animTo - animFrom) * e;
      progress = ((raw % 1) + 1) % 1;
      if (k >= 1) {
        animActive = false;
        if (mode === 'back') {
          mode = 'tour';
          // re-sync tour epoch so tourProgressAt matches current progress
          // handoff: continue linearly from current progress
          // Set tourEpoch so current progress continues seamlessly going forward via tour
          tourEpoch = now;
          // Store offset: tour base is progress at handoff
          tourBase = progress;
          useTourBase = true;
        }
      }
    } else if (mode === 'intro' || mode === 'tour') {
      if (useTourBase) {
        const u = ((now - tourEpoch) / TOUR_MS) % 1;
        progress = (tourBase + u) % 1;
      } else {
        progress = tourProgressAt(now);
      }
    }

    applyDash(progress, segLen);
    requestAnimationFrame(frame);
  }

  let tourBase = 0, useTourBase = false;

  addEventListener('resize', () => { layout(); });
  // fonts / first layout
  const boot = () => { layout(); requestAnimationFrame(frame); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
  // second layout after enter animation settles size
  setTimeout(layout, 100);
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
