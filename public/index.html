<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen — One interaction a day.</title>
<meta name="description" content="Lumen — one interaction a day. Motion studies in Web, SwiftUI and Compose by @aldininin.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
@property --r { syntax:'<length>'; inherits:true; initial-value:0px; }
:root{
  color-scheme:dark; --bg:#0B0B0C; --fg:#EDEDED; --dim:#6B6B6B; --amber:#FFB547;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --x:50vw; --y:50vh; --r:0px; --rmax:320px;           /* light, viewport coords; written by JS */
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:600 15px/1.4 Geist,"Inter Display",Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.04em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font:400 12px/1.4 "JetBrains Mono",ui-monospace,monospace;letter-spacing:0;color:var(--dim)}
a{color:inherit;text-decoration:none}

/* the light: fixed layer, only transforms/opacity-free gradient driven by vars */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle var(--r) at var(--x) var(--y),rgba(255,181,71,.16),rgba(255,181,71,.05) 45%,transparent 100%)}
body.intro .glow,body.intro .hero-lit{animation:grow 900ms var(--ease) 400ms both}
@keyframes grow{from{--r:0px}to{--r:var(--rmax)}}

.hero{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6vw}
.word{position:relative;font-size:18vw;line-height:.85;letter-spacing:-.04em;font-weight:600}
.word span{display:block}
.hero-base{opacity:.08}
.hero-lit{position:absolute;inset:0;color:var(--fg);
  /* mask in viewport coords: element is in normal flow, so convert with --hx/--hy (hero offset) */
  -webkit-mask:radial-gradient(circle var(--r) at calc(var(--x) - var(--hx,0px)) calc(var(--y) - var(--hy,0px)),#000 0,rgba(0,0,0,.6) 40%,transparent 100%);
          mask:radial-gradient(circle var(--r) at calc(var(--x) - var(--hx,0px)) calc(var(--y) - var(--hy,0px)),#000 0,rgba(0,0,0,.6) 40%,transparent 100%)}
.sub{margin-top:3vw;font-size:clamp(18px,2vw,28px);color:var(--fg)}
.issue{margin-top:14px}
body.intro .sub,body.intro .issue{animation:rise 900ms var(--ease) 600ms both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

main{position:relative;z-index:1;padding:0 clamp(20px,5vw,72px) 120px;max-width:1440px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{position:relative;display:block;border-radius:14px;overflow:hidden;aspect-ratio:4/5;background:#111113;
  opacity:0;transform:translateY(20px);transition:opacity 600ms var(--ease),transform 600ms var(--ease);transition-delay:var(--d,0ms)}
.card.in{opacity:1;transform:none}
.card.in.lit{transform:translateY(-4px)}
.card{box-shadow:0 0 0 1px rgba(255,181,71,0)}
.card.in.lit,.card.in:hover{box-shadow:0 0 0 1px rgba(255,181,71,.35);transition:transform 300ms var(--ease),box-shadow 300ms var(--ease)}
.card.in:hover{transform:translateY(-4px)}
.pv{position:absolute;inset:0;filter:grayscale(1) brightness(.3);transition:filter 300ms var(--ease)}
.card.lit .pv,.card:hover .pv{filter:none}
.card.ph-card .pv,.card.ph-card.lit .pv,.card.ph-card:hover .pv{filter:grayscale(1) brightness(.3)}
.card.ph-card.lit .pv,.card.ph-card:hover .pv{filter:grayscale(1) brightness(.85)}
.pv iframe{width:100%;height:100%;border:0;pointer-events:none}
.meta{position:absolute;left:0;right:0;bottom:0;padding:18px 20px;background:linear-gradient(transparent,rgba(11,11,12,.85));
  transform:translateY(100%);transition:transform 300ms var(--ease)}
.card.lit .meta,.card:hover .meta{transform:none}
.meta h3{font-size:20px;font-weight:600;margin:4px 0 6px}
.card:hover .meta .no,.card.lit .meta .no{color:var(--amber)}

/* generative placeholders */
.ph{position:absolute;inset:0;display:grid;place-items:center}
.ph-orbit i{position:absolute;width:12px;height:12px;border-radius:50%;background:#EDEDED;left:50%;top:50%;margin:-6px;animation:orbit 3.2s linear infinite;animation-delay:calc(var(--i) * -.4s);offset-path:circle(30% at 50% 50%)}
@supports not (offset-path:circle(30%)){.ph-orbit i{animation:orbit2 3.2s linear infinite;animation-delay:calc(var(--i) * -.4s)}}
@keyframes orbit{to{offset-distance:100%}}
@keyframes orbit2{from{transform:rotate(0) translateX(70px)}to{transform:rotate(360deg) translateX(70px)}}
.ph-bars{display:flex;gap:8px;align-items:center;justify-content:center}
.ph-bars i{width:8px;height:120px;border-radius:4px;background:linear-gradient(#EDEDED,#6B6B6B);animation:eq 1.2s var(--ease) infinite alternate;animation-delay:calc(var(--i) * -.15s);transform-origin:center}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.ph-blob span{width:46%;aspect-ratio:1;background:conic-gradient(from 0deg,#EDEDED,#3a3a3c,#9a9a9a,#EDEDED);filter:blur(2px);animation:morph 6s ease-in-out infinite,spin 9s linear infinite}
@keyframes morph{0%,100%{border-radius:42% 58% 63% 37%/41% 44% 56% 59%}50%{border-radius:63% 37% 38% 62%/55% 62% 38% 45%}}
@keyframes spin{to{rotate:360deg}}

footer{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:32px clamp(20px,5vw,72px) 48px;color:var(--dim);font-size:14px;letter-spacing:-.02em}
footer nav{display:flex;gap:24px}
footer a{transition:color 300ms var(--ease)} footer a:hover{color:var(--fg)}

@media (pointer:coarse),(max-width:760px){
  :root{--rmax:min(200px,55vw)}
  .hero-lit{color:#fff;-webkit-mask:radial-gradient(circle var(--r) at calc(var(--x) - var(--hx,0px)) calc(var(--y) - var(--hy,0px)),#000 0,#000 55%,transparent 100%);mask:radial-gradient(circle var(--r) at calc(var(--x) - var(--hx,0px)) calc(var(--y) - var(--hy,0px)),#000 0,#000 55%,transparent 100%)}
  .glow{background:radial-gradient(circle var(--r) at var(--x) var(--y),rgba(255,181,71,.22),rgba(255,181,71,.12) 55%,transparent 100%)}
}
@media (max-width:760px){.grid{grid-template-columns:1fr}.card{aspect-ratio:4/3}}
@media (prefers-reduced-motion:reduce){
  body.intro .glow,body.intro .hero-lit,body.intro .sub,body.intro .issue{animation:none}
  :root{--r:var(--rmax)}
  .card{transition:none;opacity:1;transform:none}
  .ph *{animation:none!important}
}
</style>
</head>
<body class="intro">
<div class="glow" aria-hidden="true"></div>
<section class="hero">
  <h1 class="word" id="word"><span class="hero-base">Lumen</span><span class="hero-lit" aria-hidden="true">Lumen</span></h1>
  <p class="sub">One interaction a day.</p>
  <p class="issue mono" id="issue">No. 000 · Index</p>
</section>
<main><div class="grid" id="grid"></div></main>
<footer>
  <span>Built daily by <a href="https://x.com/aldininin">@aldininin</a></span>
  <nav class="mono"><a href="https://github.com/SolitaryMist/lumen">GitHub</a><a href="https://x.com/aldininin">X</a></nav>
</footer>
<script>
(() => {
  const root = document.documentElement, body = document.body;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmt = d => { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? '' : `${MON[t.getMonth()]} ${t.getDate()}`; };
  const TAGS = 'Web · SwiftUI · Compose';
  const PH = ['orbit','bars','blob'];
  const grid = document.getElementById('grid');

  function render(items) {
    const list = items.length ? items : [
      { no:'001', title:'Coming soon', ph:'orbit' }, { no:'002', title:'Coming soon', ph:'bars' }, { no:'003', title:'Coming soon', ph:'blob' }];
    if (items.length) document.getElementById('issue').textContent = `No. ${items[0].no}${items[0].date ? ' · ' + fmt(items[0].date) : ''}`;
    grid.innerHTML = '';
    list.forEach((p, i) => {
      const a = document.createElement(p.slug ? 'a' : 'div');
      a.className = p.slug ? 'card' : 'card ph-card'; if (p.slug) a.href = `/${p.slug}/`;
      const kind = p.ph || PH[i % 3];
      const n = kind === 'bars' ? 9 : kind === 'orbit' ? 8 : 0;
      const ph = kind === 'blob' ? '<span></span>' : Array.from({length:n},(_,k)=>`<i style="--i:${k}"></i>`).join('');
      // real pieces: lazy iframe of the piece itself as the looping preview
      const pv = p.slug ? `<iframe src="/${p.slug}/" loading="lazy" tabindex="-1" title=""></iframe>` : `<div class="ph ph-${kind}">${ph}</div>`;
      a.innerHTML = `<div class="pv">${pv}</div><div class="meta"><span class="mono no">No. ${p.no}${p.date ? ' · ' + fmt(p.date) : ''}</span><h3></h3><span class="mono">${TAGS}</span></div>`;
      a.querySelector('h3').textContent = p.title;
      grid.appendChild(a);
    });
    cards = [...grid.children]; measure(); observe();
  }

  // scroll-in stagger
  let cards = [];
  function observe() {
    const io = new IntersectionObserver(es => {
      let k = 0;
      for (const e of es) if (e.isIntersecting) { e.target.style.setProperty('--d', (k++ * 60) + 'ms'); e.target.classList.add('in'); io.unobserve(e.target); }
    }, { threshold: .15 });
    cards.forEach(c => io.observe(c));
  }

  // cached geometry (document coords) — read only on resize/load, never per frame
  let rects = [], hero = {x:0,y:0};
  function measure() {
    const sy = scrollY, sx = scrollX, w = document.getElementById('word').getBoundingClientRect();
    hero = { x: w.left + sx, y: w.top + sy, w: w.width, h: w.height };
    rects = cards.map(c => { const r = c.getBoundingClientRect(); return { l:r.left+sx, t:r.top+sy - (c.classList.contains('in')?0:20), r:r.right+sx, b:r.bottom+sy }; });
  }
  addEventListener('resize', measure); addEventListener('load', measure);
  document.fonts && document.fonts.ready.then(measure);

  // spring (stiffness 120, damping 20, mass 1)
  const mobile = matchMedia('(pointer: coarse), (max-width: 760px)').matches;
  const RMAX = mobile ? Math.min(200, innerWidth * .55) : 320;
  // cubic-bezier(0.65,0,0.35,1) solver
  const bez = (x1,y1,x2,y2) => t => { const B=(a,b,u)=>3*a*u*(1-u)*(1-u)+3*b*u*u*(1-u)+u*u*u; let lo=0,hi=1,u=t; for(let i=0;i<24;i++){u=(lo+hi)/2; B(x1,x2,u)<t?lo=u:hi=u;} return B(y1,y2,u); };
  const sweepEase = bez(.65,0,.35,1); let sweepStart = performance.now() + 400, sweeping = mobile && !reduce;
  const K = 120, C = 20;
  let driftT0 = 0, tx = innerWidth/2, ty = innerHeight/2, x = tx, y = ty, vx = 0, vy = 0, touching = false, last = performance.now();
  if (!reduce) {
    addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; if (e.pointerType !== 'mouse') touching = true; }, {passive:true});
    addEventListener('pointerdown', e => { tx = e.clientX; ty = e.clientY; touching = e.pointerType !== 'mouse'; }, {passive:true});
    addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') touching = false; }, {passive:true});
    addEventListener('pointercancel', () => touching = false, {passive:true});
  }
  const lit = new Set();
  function frame(now) {
    const dt = Math.min(.032, (now - last) / 1000); last = now;
    if (reduce) { x = innerWidth/2; y = innerHeight/2; }
    else {
      if (sweeping && !touching) {
        const k = Math.min(1, Math.max(0, (now - sweepStart) / 1200)), e = sweepEase(k);
        const hx = hero.x - scrollX, w = hero.w;
        x = tx = hx - RMAX*.3 + e * (w + RMAX*.6); y = ty = hero.y - scrollY + hero.h/2; vx = vy = 0;
        if (k >= 1) { sweeping = false; driftT0 = now; }
      } else if (mobile && !touching) { // drift near midline, following scroll
        const t = (now - driftT0) / 1000 + 3.5, s = scrollY;
        tx = innerWidth/2 + Math.sin(t*2*Math.PI/14 + s*.0012) * innerWidth*.28;
        ty = innerHeight/2 + Math.sin(t*2*Math.PI/19 + s*.0015) * innerHeight*.08;
      }
      vx += (K*(tx-x) - C*vx) * dt; vy += (K*(ty-y) - C*vy) * dt;
      x += vx*dt; y += vy*dt;
    }
    root.style.setProperty('--x', x.toFixed(1)+'px');
    root.style.setProperty('--y', y.toFixed(1)+'px');
    const sy = scrollY, sx = scrollX;
    root.style.setProperty('--hx', (hero.x - sx).toFixed(1)+'px');
    root.style.setProperty('--hy', (hero.y - sy).toFixed(1)+'px');
    // light hits card when the 320px circle (core ~60%) overlaps its rect
    const px = x + sx, py = y + sy, R = RMAX * .6;
    for (let i = 0; i < cards.length; i++) {
      const r = rects[i]; if (!r) continue;
      const dx = Math.max(r.l - px, 0, px - r.r), dy = Math.max(r.t - py, 0, py - r.b);
      const on = dx*dx + dy*dy < R*R;
      if (on !== lit.has(i)) { on ? lit.add(i) : lit.delete(i); cards[i].classList.toggle('lit', on); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(() => body.classList.remove('intro'), 1600); root.style.setProperty('--r', getComputedStyle(root).getPropertyValue('--rmax').includes('min') ? Math.min(200, innerWidth*.55)+'px' : '320px');
  // keep --r at 320 after intro (animation fills until then)

  fetch('/pieces.json').then(r => r.json()).then(render).catch(() => render([]));
})();
</script>
</body>
</html>
