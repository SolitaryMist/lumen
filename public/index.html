<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen</title>
<meta name="description" content="Lumen — a daily collection of interaction, motion and 3D studies.">
<style>
  :root { color-scheme: dark; --fg:#f2f2f0; --dim:#6b6b68; --line:#1c1c1b; }
  * { box-sizing: border-box; margin: 0; }
  body { background:#000; color:var(--fg); font:15px/1.5 ui-sans-serif, -apple-system, "Inter", "Helvetica Neue", sans-serif; min-height:100vh; padding: clamp(28px,6vw,88px); -webkit-font-smoothing:antialiased; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:24px; margin-bottom: clamp(64px,14vh,160px); }
  h1 { font-size: clamp(56px,11vw,148px); font-weight:500; letter-spacing:-.05em; line-height:.9; }
  header p { color:var(--dim); max-width:22ch; text-align:right; }
  ol { list-style:none; padding:0; border-top:1px solid var(--line); }
  li a { display:grid; grid-template-columns: 4ch 1fr auto; gap:24px; padding:18px 0; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; transition: padding .4s cubic-bezier(.2,.8,.2,1), color .3s; }
  li a:hover { padding-left:12px; }
  .no, .date { color:var(--dim); font-variant-numeric: tabular-nums; }
  .empty { color:var(--dim); padding:18px 0; }
  footer { margin-top:96px; color:var(--dim); font-size:13px; }
  footer a { color:inherit; }
  @media (max-width:600px){ header{flex-direction:column} header p{text-align:left} }
</style>
</head>
<body>
<header>
  <h1>Lumen</h1>
  <p>A daily collection of interaction, motion and 3D studies.</p>
</header>
<main><ol id="list"><li class="empty">First piece arriving soon.</li></ol></main>
<footer><a href="https://x.com/aldininin">@aldininin</a> · <a href="https://github.com/SolitaryMist/lumen">source</a></footer>
<script>
fetch('/pieces.json').then(r => r.json()).then(items => {
  if (!items.length) return;
  const ol = document.getElementById('list'); ol.innerHTML = '';
  for (const p of items) {
    const li = document.createElement('li');
    li.innerHTML = `<a href="/${p.slug}/"><span class="no">${p.no}</span><span class="t"></span><span class="date">${p.date}</span></a>`;
    li.querySelector('.t').textContent = p.title;
    ol.appendChild(li);
  }
}).catch(() => {});
</script>
</body>
</html>
